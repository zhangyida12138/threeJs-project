<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PageAgent 深度测试环境</title>
    <style>
        :root { --primary: #ff6a00; } /* 阿里系常用的橙色调 */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .canvas { width: 800px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { border: 1px solid #e8e8e8; padding: 15px; border-radius: 8px; }
        h3 { border-bottom: 2px solid var(--primary); padding-bottom: 5px; margin-top: 0; font-size: 16px; }
        
        /* 交互元素样式 */
        .form-item { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #666; }
        input[type="text"], select { width: 100%; padding: 8px; border: 1px solid #d9d9d9; border-radius: 4px; }
        .btn { cursor: pointer; padding: 8px 16px; border-radius: 4px; border: none; background: var(--primary); color: white; font-weight: bold; }
        .btn-secondary { background: #e6f7ff; color: #1890ff; border: 1px solid #91d5ff; margin-left: 10px; }
        
        /* 状态显示 */
        #console { background: #2d2d2d; color: #a6e22e; padding: 15px; border-radius: 5px; font-family: monospace; height: 100px; overflow-y: auto; margin-top: 20px; }
        .loading { display: none; color: var(--primary); font-size: 12px; }
    </style>
</head>
<body>
<script src="https://registry.npmmirror.com/page-agent/1.8.1/files/dist/iife/page-agent.demo.js" crossorigin="true"></script>
<div class="canvas">
    <header>
        <h1 style="color: #333;">PageAgent 自动化兼容性页面</h1>
        <p style="color: #999; font-size: 14px;">支持测试：元素定位、异步加载、复杂选择器、状态检测</p>
    </header>

    <div class="grid">
        <!-- 模块 1: 基础表单 -->
        <div class="card">
            <h3>表单录入</h3>
            <div class="form-item">
                <label>任务名称</label>
                <input type="text" id="taskName" placeholder="例如：采集数据">
            </div>
            <div class="form-item">
                <label>执行策略</label>
                <select id="strategy">
                    <option value="once">单次执行</option>
                    <option value="loop">循环触发</option>
                    <option value="delay">延迟启动</option>
                </select>
            </div>
            <button class="btn" onclick="logAction('保存配置成功')">保存</button>
        </div>

        <!-- 模块 2: 动态交互 -->
        <div class="card">
            <h3>异步逻辑</h3>
            <p style="font-size: 13px;">点击后等待 2 秒会出现结果：</p>
            <button class="btn btn-secondary" onclick="startAsync()">开始异步任务</button>
            <span id="loader" class="loading">⏳ 处理中...</span>
            <div id="async-result" style="margin-top:10px; color: #52c41a;"></div>
        </div>

        <!-- 模块 3: 复杂选择器 -->
        <div class="card">
            <h3>多选列表</h3>
            <div>
                <input type="checkbox" id="c1" name="opt"> <label style="display:inline;" for="c1">自动截图</label>
            </div>
            <div>
                <input type="checkbox" id="c2" name="opt"> <label style="display:inline;" for="c2">发送邮件通知</label>
            </div>
            <div style="margin-top:10px;">
                <button class="btn" style="background: #52c41a;" onclick="verifyCheckboxes()">检查选中状态</button>
            </div>
        </div>

        <!-- 模块 4: 隐藏陷阱 (测试 Agent 鲁棒性) -->
        <div class="card">
            <h3>权限验证</h3>
            <p>需先开启“专家模式”才能看到隐藏按钮</p>
            <button class="btn-secondary" id="mode-toggle" onclick="toggleExpert()">开启专家模式</button>
            <button id="secret-btn" class="btn" style="display:none; margin-top:10px; background: #722ed1;">特权提交</button>
        </div>
    </div>

    <!-- 模拟控制台输出 -->
    <div id="console">>> 等待 Agent 操作...</div>
    <input type="text" id="input" placeholder="请输入指令">
    <button class="btn" onclick="executeCommand()">执行</button>
    <button class="btn" onclick="openPanel()">打开面板</button>
</div>

<script>
    function logAction(msg) {
        const consoleEl = document.getElementById('console');
        const time = new Date().toLocaleTimeString();
        consoleEl.innerHTML += `<div>[${time}] ${msg}</div>`;
        consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function startAsync() {
        document.getElementById('loader').style.display = 'inline';
        document.getElementById('async-result').innerText = '';
        setTimeout(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('async-result').innerText = '✅ 异步数据已就绪：ID_99582';
            logAction('接收到异步响应');
        }, 2000);
    }

    function toggleExpert() {
        const secretBtn = document.getElementById('secret-btn');
        const isHidden = secretBtn.style.display === 'none';
        secretBtn.style.display = isHidden ? 'block' : 'none';
        document.getElementById('mode-toggle').innerText = isHidden ? '关闭专家模式' : '开启专家模式';
        logAction(isHidden ? '专家模式已激活' : '专家模式已关闭');
    }

    function verifyCheckboxes() {
        const checked = Array.from(document.querySelectorAll('input[name="opt"]:checked')).length;
        logAction(`当前选中了 ${checked} 个选项`);
    }
    const agent = new PageAgent({
    model: 'deepseek-v4-pro',
    baseURL: 'https://api.deepseek.com',
    apiKey: '',
    language: 'zh-CN'
    })
    
    async function executeCommand() {
        const command = document.getElementById('input').value;
        await agent.execute(command);
    }

    function openPanel() {
        agent.panel.show();
    }
</script>

</body>
</html>
