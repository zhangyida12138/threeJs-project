<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WebGIS</title>
  <!-- 引入Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""/>
  <style>
    /* 地图必须给宽高 */
    #map {
      width: 100%;
      height: 600px;
    }
  </style>
</head>
<body>
    <button type="button" id="back">back</button>
  <div id="map"></div>

  <!-- 原生引入 WebGIS 库 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

  <script>
    const originalPos = [23.047, 113.771];
    const map = L.map('map').setView(originalPos, 12);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markerList = []
    let currentLine = null;
    map.on('click', (e) => {
        markerList.push(e.latlng);
        L.marker(e.latlng).addTo(map);
        if(markerList.length >= 2) {
            if(currentLine) {
                currentLine.remove();
            }
            currentLine = L.polyline(markerList, {color: 'red', weight: 2}).addTo(map);
            console.log(currentLine);
            map.fitBounds(currentLine.getBounds());
        }
    });
    back.addEventListener('click', () => {
        map.flyTo(originalPos, 12);
    });
  </script>
</body>
</html>
